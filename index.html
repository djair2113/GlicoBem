<form id="glicemiaForm" onsubmit="event.preventDefault(); addMeasurement();">
      <div class="form-group">
        <label for="valorGlicemia">Valor da Glicemia (mg/dL):</label>
        <input type="number" id="valorGlicemia" placeholder="Ex: 145" required>
      </div>

      <div class="form-group">
        <label for="momentoGlicemia">Momento / Refeição:</label>
        <select id="momentoGlicemia">
          <option value="Em Jejum">Em Jejum</option>
          <option value="Café da manhã">Café da manhã</option>
          <option value="Após o Café">Após o Café</option>
          <option value="Almoço">Almoço</option>
          <option value="Após o Almoço">Após o Almoço</option>
          <option value="Janta">Janta</option>
          <option value="Após a Janta">Após a Janta</option>
          <option value="Noite">Noite</option>
          <option value="Madrugada">Madrugada</option>
        </select>
      </div>

      <div class="form-group">
        <label for="dataHoraGlicemia">Data e Hora:</label>
        <input type="datetime-local" id="dataHoraGlicemia" required>
      </div>

      <button type="button" onclick="addMeasurement();" class="btn-primary">Salvar Medição</button>
    </form>
